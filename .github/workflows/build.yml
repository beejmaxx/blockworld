name: macOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: brew install cmake ninja sdl3 glm llvm
      - name: Select C++26 compiler
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
